<link rel="stylesheet" href="assets/tailwind.css" />
<style>
  :root{
    --ink-900:#070708;
    --ink-800:#0a0a0c;
    --ink-700:#101014;
    --ink-600:#15161b;
    --ink-500:#1c1d24;
    --bone-50:#fafaf7;
    --bone-100:#f3f2ec;
    --bone-200:#dcdad1;
    --bone-300:#a3a2a0;
    --gold-200:#e3c98a;
    --gold-300:#d8b66a;
    --gold-400:#cba255;
    --gold-500:#b8924f;
  }
  html,body{background:var(--ink-800);color:var(--bone-50);}
  body{font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";}
  .font-display{font-family:'Cormorant Garamond',serif;font-weight:400;}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}

  /* perf: only render sections near the viewport */
  main > section{content-visibility:auto;contain-intrinsic-size:auto 900px;}

  /* eyebrow */
  .eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-300);}
  .eyebrow .dot{display:inline-block;width:5px;height:5px;background:currentColor;border-radius:99px;margin:0 .7em .15em 0;vertical-align:middle;}

  /* gold rule */
  .rule-gold{height:1px;background:linear-gradient(90deg,transparent,var(--gold-500) 30%,var(--gold-500) 70%,transparent);}

  /* placeholders for imagery -- cinematic dark with subtle texture */
  .ph{
    position:relative;overflow:hidden;background:
      radial-gradient(120% 80% at 30% 20%, rgba(216,182,106,.12), transparent 60%),
      radial-gradient(100% 80% at 80% 90%, rgba(216,182,106,.08), transparent 55%),
      linear-gradient(135deg, #0e0f14 0%, #14161d 50%, #0a0b10 100%);
    isolation:isolate;
  }
  .ph::before{
    content:"";position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 22px);
    mix-blend-mode:overlay;pointer-events:none;
  }
  .ph::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(60% 60% at 50% 50%, transparent, rgba(0,0,0,.55));
    pointer-events:none;
  }
  .ph-label{
    position:absolute;left:14px;bottom:12px;z-index:2;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:10px;letter-spacing:.15em;text-transform:uppercase;
    color:rgba(231,219,184,.55);
  }
  .ph-label::before{content:"// ";color:rgba(216,182,106,.5);}

  /* hero film grain */
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.14;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.86  0 0 0 0.32 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}

  /* light beam */
  .beam{position:absolute;inset:auto 0 0 0;height:80%;pointer-events:none;
    background:radial-gradient(60% 100% at 50% 100%, rgba(216,182,106,.22), transparent 60%);}

  /* hero entrance */
  @media (prefers-reduced-motion: no-preference){
    @keyframes heroUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }
    .hero-in{animation:heroUp 1s cubic-bezier(.2,.7,.2,1) both}
    .hero-in-late{animation-delay:.25s}
  }

  /* hover lift */
  .lift{transition:transform .5s cubic-bezier(.2,.7,.2,1), border-color .3s, background-color .3s, box-shadow .5s;}
  .lift:hover{transform:translateY(-4px);}
  .tile-arrow{border:1px solid rgba(255,255,255,.22);background:rgba(7,7,8,.55);backdrop-filter:blur(8px);color:#fafaf7}
  .group:hover .tile-arrow{background:#e3c98a;border-color:#e3c98a;color:#0b0b0d}
  .tile-clamp{-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

  /* nav scroll state */
  /* ── Menu plein écran (bouton 3 traits) ───────────────────────────────── */
  .nav-burger{background:rgba(6,26,68,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .nav-menu{position:fixed;inset:0;z-index:49;display:flex;align-items:center;
    background:rgba(4,14,38,.86);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease;overflow-y:auto;padding:112px 0 44px}
  .nav-menu.is-open{opacity:1;visibility:visible}
  .nav-menu-inner{width:100%;transform:translateY(-14px);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  .nav-menu.is-open .nav-menu-inner{transform:none}
  .nav-link{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 2px;
    font-family:'Archivo','Manrope',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em;
    color:#f3f2ec;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.07);transition:color .22s,padding .22s}
  .nav-link svg{opacity:0;transform:translateX(-6px);transition:opacity .22s,transform .22s;flex-shrink:0}
  .nav-link:hover{color:#f4c238;padding-left:9px}
  .nav-link:hover svg{opacity:1;transform:none}
  @media (max-width:640px){ .nav-link{font-size:17px;padding:10px 2px} .nav-menu{padding-top:100px} }

  /* ── Barre compacte + masquage au défilement (gagne de la place à l'écran) ── */
  header{transition:transform .34s cubic-bezier(.2,.7,.2,1), background-color .3s ease}
  .nav-bar{height:88px;transition:height .3s cubic-bezier(.2,.7,.2,1)}
  image-slot#church-logo{width:66px;height:66px;transition:width .3s cubic-bezier(.2,.7,.2,1),height .3s cubic-bezier(.2,.7,.2,1)}
  .nav-title{font-size:30px;transition:font-size .3s cubic-bezier(.2,.7,.2,1)}
  @media (max-width:640px){ .nav-title{font-size:24px} }

  /* état compact : après le Hero, l'en-tête se resserre */
  .nav-compact .nav-bar{height:58px}
  .nav-compact image-slot#church-logo{width:40px;height:40px}
  .nav-compact .nav-title{font-size:21px}
  @media (max-width:640px){ .nav-compact .nav-title{font-size:18px} }

  /* la barre de sections suit la hauteur de l'en-tête */
  .section-nav{top:88px;transition:opacity .3s ease,transform .34s cubic-bezier(.2,.7,.2,1),top .3s cubic-bezier(.2,.7,.2,1)}
  .nav-compact .section-nav{top:58px}

  /* masquage vers le haut quand on descend — retour immédiat en remontant */
  html.nav-hidden header{transform:translateY(-100%)}
  html.nav-hidden .section-nav,
  html.nav-hidden .section-nav.sn-in{transform:translateY(calc(-100% - 62px))}
  @media (prefers-reduced-motion: reduce){
    header,.nav-bar,.nav-logo,.nav-title,.section-nav{transition:none}
  }

  a:focus-visible,button:focus-visible,.nav-link:focus-visible,.section-nav-chip:focus-visible{
    outline:2px solid var(--gold-300,#d8b66a);outline-offset:3px;border-radius:4px}
  @media (prefers-reduced-motion: reduce){ .marq,.slow-zoom{animation:none} }
  .nav-scrolled{background:rgba(7,7,8,.78);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid rgba(216,182,106,.12);}

  /* reveal on scroll */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1;transform:none;}
  .reveal-stagger > * {opacity:0;transition:opacity .7s cubic-bezier(.2,.7,.2,1);}
  .reveal-stagger.in > *{opacity:1;transition:opacity .6s cubic-bezier(.2,.7,.2,1)}
  .reveal-stagger.in > *:nth-child(1){transition-delay:.05s}
  .reveal-stagger.in > *:nth-child(2){transition-delay:.12s}
  .reveal-stagger.in > *:nth-child(3){transition-delay:.19s}
  .reveal-stagger.in > *:nth-child(4){transition-delay:.26s}
  .reveal-stagger.in > *:nth-child(5){transition-delay:.33s}
  .reveal-stagger.in > *:nth-child(6){transition-delay:.40s}
  .reveal-stagger.in > *:nth-child(7){transition-delay:.47s}
  .reveal-stagger.in > *:nth-child(n+8){transition-delay:.54s}
  /* Guarantee: stagger rows are never left permanently hidden (opacity-only, no transform → hover transforms elsewhere untouched) */
  html.revealed .reveal-stagger > *{opacity:1!important}

  /* marquee */
  @keyframes marq { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .marq{animation:marq 40s linear infinite;}

  /* slow zoom on hero placeholder */
  @keyframes slow-zoom { from{transform:scale(1.06)} to{transform:scale(1.18)} }
  .slow-zoom{animation:slow-zoom 22s ease-in-out infinite alternate;}

  /* gold shimmer for headlines */
  .gold-shimmer{
    background:linear-gradient(90deg,#d8b66a 0%,#f6e6b8 40%,#cba255 60%,#d8b66a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% 100%;animation:shim 8s ease-in-out infinite;
  }
  @keyframes shim {0%,100%{background-position:0 0}50%{background-position:100% 0}}

  /* btn */
  .btn{display:inline-flex;align-items:center;gap:.6rem;padding:.85rem 1.4rem;border-radius:999px;font-weight:500;letter-spacing:.02em;font-size:14px;transition:all .25s;}
  .btn-gold{background:var(--gold-300);color:#0a0a0c;}
  .btn-gold:hover{background:var(--gold-200);}
  .btn-ghost{background:transparent;color:var(--bone-50);border:1px solid rgba(231,219,184,.25);}
  .btn-ghost:hover{border-color:var(--gold-300);color:var(--gold-200);}
  .btn-dark{background:rgba(10,10,12,.6);color:var(--bone-50);border:1px solid rgba(255,255,255,.08);}
  .btn-dark:hover{background:rgba(10,10,12,.85);border-color:rgba(216,182,106,.4);}

  /* gallery masonry */
  .masonry{column-count:1;column-gap:14px;}
  @media (min-width: 640px){.masonry{column-count:2}}
  @media (min-width: 1024px){.masonry{column-count:3}}
  @media (min-width: 1280px){.masonry{column-count:4}}
  .masonry > *{break-inside:avoid;margin-bottom:14px;display:block;}

  /* tasteful scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0a0a0c}
  ::-webkit-scrollbar-thumb{background:#2d2e37;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#3b3c46}

  /* selection */
  ::selection{background:var(--gold-400);color:#0a0a0c}

  /* number ticker tick */
  .tick{font-variant-numeric:tabular-nums;}

  /* glow */
  .glow{box-shadow:0 0 0 1px rgba(216,182,106,.18), 0 30px 80px -40px rgba(216,182,106,.45);}

  /* photos : fond sombre pendant le chargement (évite les cases vides claires) */
  main img[class*="object-cover"]{background-color:#101014}

  /* assistance IA */
  .sb-root{position:fixed;right:22px;bottom:22px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:12px;font-family:'Manrope',system-ui,sans-serif}
  .sb-fab{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:999px;background:var(--gold-300,#d8b66a);color:#0a0a0c;border:none;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.04em;box-shadow:0 18px 40px -18px rgba(0,0,0,.8);transition:transform .25s ease,background .25s ease}
  .sb-fab:hover{transform:translateY(-2px);background:var(--gold-200,#e3c98a)}
  .sb-fab-label{text-transform:uppercase}
  .sb-panel{width:min(88vw,382px);max-height:min(74vh,620px);display:flex;flex-direction:column;background:rgba(12,12,15,.96);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:6px;box-shadow:0 40px 90px -35px rgba(0,0,0,.9);overflow:hidden;animation:gshowFade .28s ease both}
  .sb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sb-dot{width:9px;height:9px;border-radius:999px;background:#7fd48a;box-shadow:0 0 0 4px rgba(127,212,138,.16)}
  .sb-tabs{display:flex;gap:6px;padding:10px 14px 0}
  .sb-tab{flex:1;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:none;color:#dcdad1;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.2s}
  .sb-tab.is-on{background:var(--gold-300,#d8b66a);border-color:var(--gold-300,#d8b66a);color:#0a0a0c}
  .sb-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .sb-msg{max-width:88%;padding:11px 13px;border-radius:4px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
  .sb-wa{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:7px 13px;border-radius:999px;background:#25D366;color:#0a2160;font-weight:700;font-size:11.5px;letter-spacing:.03em;text-decoration:none;transition:filter .2s}
  .sb-wa:hover{filter:brightness(1.08)}
  .sb-ai{align-self:flex-start;background:rgba(255,255,255,.07);color:#f3f2ec;border:1px solid rgba(255,255,255,.08)}
  .sb-me{align-self:flex-end;background:var(--gold-300,#d8b66a);color:#0a0a0c;font-weight:500}
  .sb-typing{display:flex;gap:5px;align-items:center}
  .sb-typing span{width:6px;height:6px;border-radius:999px;background:#d8b66a;animation:sbBlink 1.1s infinite}
  .sb-typing span:nth-child(2){animation-delay:.18s}.sb-typing span:nth-child(3){animation-delay:.36s}
  @keyframes sbBlink{0%,100%{opacity:.25}50%{opacity:1}}
  .sb-logitem{padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:4px;background:rgba(255,255,255,.04)}
  .sb-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
  .sb-quick button{padding:7px 11px;border-radius:999px;border:1px solid rgba(216,182,106,.35);background:none;color:#e3c98a;font-size:11.5px;cursor:pointer;transition:.2s}
  .sb-quick button:hover{background:rgba(216,182,106,.14)}
  .sb-quick button:disabled{opacity:.45;cursor:default}
  .sb-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.1)}
  .sb-form input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:11px 15px;color:#fafaf7;font-size:13.5px;outline:none}
  .sb-form input:focus{border-color:var(--gold-300,#d8b66a)}
  .sb-form button{width:42px;height:42px;flex:none;border-radius:999px;border:none;background:var(--gold-300,#d8b66a);color:#0a0a0c;display:grid;place-items:center;cursor:pointer;transition:.2s}
  .sb-form button:disabled{opacity:.4;cursor:default}
  @media (max-width:560px){.sb-root{right:14px;bottom:14px}.sb-fab-label{display:none}.sb-fab{padding:14px}}

  /* galerie · mosaïque de diaporamas */
  .gmosaic{display:grid;gap:14px;grid-template-columns:1fr}
  .gmosaic>.gtile{aspect-ratio:4/3;width:100%}
  @media (min-width:768px){.gmosaic{grid-template-columns:repeat(12,1fr);grid-auto-rows:210px}.gmosaic>.gtile{aspect-ratio:auto;height:100%}.gt-a{grid-column:span 7;grid-row:span 2}.gt-b{grid-column:span 5}.gt-c{grid-column:span 5}.gt-d,.gt-e,.gt-f{grid-column:span 4}}
  @media (min-width:1280px){.gmosaic{grid-auto-rows:255px}}
  @keyframes gshowFade{from{opacity:0}to{opacity:1}}
  @keyframes gshowKB{from{transform:scale(1.02)}to{transform:scale(1.12)}}
  .gshow-fade{animation:gshowFade 1.15s ease both}
  @media (prefers-reduced-motion: no-preference){.gshow-kb{animation:gshowFade 1.15s ease both, gshowKB 9s ease-out both}}

  /* lightbox */
  .lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:5vw;}

  /* smooth anchor jumps, clear of fixed header + section banner */
  html{scroll-behavior:smooth;scroll-padding-top:112px}

  /* section quick-nav banner */
  .no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}
  .no-scrollbar::-webkit-scrollbar{display:none;height:0;width:0}
  .section-nav{background:rgba(12,13,20,.72);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-top:1px solid rgba(255,255,255,.10);transition:opacity .3s ease,transform .3s ease}
  .section-nav.sn-out{opacity:0;transform:translateY(-8px);pointer-events:none}
  .section-nav.sn-in{opacity:1;transform:none}
  .section-nav-chip{flex:none;display:inline-flex;align-items:center;padding:.4rem .85rem;border-radius:999px;border:1px solid transparent;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-200);white-space:nowrap;transition:color .25s,border-color .25s,background-color .25s}
  .section-nav-chip:hover{color:var(--gold-300);border-color:var(--gold-300)}
  .section-nav-chip.is-active{color:var(--gold-300);border-color:var(--gold-300);background:rgba(216,182,106,.10)}

  /* temple slideshow */
  .tile-arrow:hover{background:var(--gold-200);border-color:var(--gold-200);color:#0b0b0d}
  @keyframes kenb{from{transform:scale(1.02)}to{transform:scale(1.09)}}
  .temple-slide{transition:opacity .8s cubic-bezier(.2,.7,.2,1)}
  .temple-media{transform:scale(1.02)}
  .temple-slide.is-active .temple-media{animation:kenb 9s ease-out forwards}
  @media (prefers-reduced-motion:reduce){.temple-slide.is-active .temple-media{animation:none;transform:none}.slow-zoom{animation:none}}

  /* micro-interactions */
  .btn-gold{position:relative;overflow:hidden;isolation:isolate}
  .btn-gold::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.5) 50%,transparent 75%);transform:translateX(-130%);transition:transform .7s ease}
  .btn-gold:hover::after{transform:translateX(130%)}
  .lift:hover{box-shadow:0 18px 50px -28px rgba(216,182,106,.35)}
  .ph img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
  .group:hover .ph img,.lift:hover .ph img{transform:scale(1.05)}
  .reveal .rule-gold{transform:scaleX(0);transform-origin:left;transition:transform 1.1s cubic-bezier(.2,.7,.2,1) .15s}
  .reveal.in .rule-gold{transform:scaleX(1)}
  @media (prefers-reduced-motion:no-preference){
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.35}}
    .eyebrow .dot{animation:dotPulse 3.2s ease-in-out infinite}
  }
</style>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     HYBRID THEME — ICF-inspired bright sections (.sec-light) on a
     Hillsong-style cinematic dark base.
     Dark stays: Hero · Médias · Reels · Donner · Footer
     Disable this <style> (Tweaks « Ambiance: sombre ») for full dark.

<style id="hybrid-theme">
  :root{
    --paper:#faf9f5;          /* warm white */
    --paper-2:#f1eee5;        /* cream alt */
    --card:#ffffff;
    --lt-ink:#121216;
    --lt-ink-2:#4b4b52;
    --lt-ink-3:#83838c;
    --lt-line:rgba(18,18,22,.10);
    --lt-line-strong:rgba(18,18,22,.24);
    --gold-ink:#96742f;       /* deep gold, readable on white */
    --gold-deep:#7c5f24;
  }

  /* ── Typography — simplified: one display family, no serif/italic mix, no shimmer ── */
  .font-display{font-family:'Archivo','Manrope',sans-serif;font-weight:700;letter-spacing:-0.025em;}
  .font-display em{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit;}
  .gold-shimmer{background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;color:var(--gold-300);animation:none;}
  .eyebrow{font-family:'Manrope',ui-sans-serif,sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;}

  /* ── Light sections: base ── */
  .sec-light{color:var(--lt-ink);}
  .sec-light.bg-ink-800{background:var(--paper)!important}
  .sec-light.bg-ink-900{background:var(--paper-2)!important}

  /* nested dark surfaces → white cards */
  .sec-light [class*="bg-ink-7"],
  .sec-light [class*="bg-ink-6"],
  .sec-light [class*="bg-ink-5"]{background:var(--card)!important;box-shadow:0 1px 0 rgba(18,18,22,.03),0 16px 44px -30px rgba(18,18,22,.28);}
  .sec-light [class*="bg-ink-8"],
  .sec-light [class*="bg-ink-9"]{background:var(--paper-2)!important}

  /* text remap */
  .sec-light [class*="text-bone-5"]{color:var(--lt-ink)!important}
  .sec-light [class*="text-bone-1"]{color:#202027!important}
  .sec-light [class*="text-bone-2"]{color:var(--lt-ink-2)!important}
  .sec-light [class*="text-bone-3"],
  .sec-light [class*="text-bone-4"]{color:var(--lt-ink-3)!important}
  .sec-light .placeholder-bone-400::placeholder{color:rgba(75,75,82,.5)!important}

  /* gold accents → deep gold for contrast on light */
  .sec-light [class*="text-gold"]{color:var(--gold-ink)!important}
  .sec-light .eyebrow{color:var(--gold-ink)}
  .sec-light .gold-shimmer{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--gold-deep);animation:none}
  .sec-light .rule-gold{background:linear-gradient(90deg,transparent,rgba(150,116,47,.55) 30%,rgba(150,116,47,.55) 70%,transparent)}

  /* lines */
  .sec-light [class*="border-white"]{border-color:var(--lt-line)!important}
  .sec-light [class*="divide-white"] > * + *{border-color:var(--lt-line)!important}
  .sec-light [class*="bg-white/"]{background:rgba(18,18,22,.05)!important}

  /* buttons — ICF ink pills on light */
  .sec-light .btn-gold{background:#15151a;color:#faf9f5}
  .sec-light .btn-gold:hover{background:var(--gold-500);color:#0a0a0c}
  .sec-light .btn-ghost{color:var(--lt-ink);border-color:var(--lt-line-strong)}
  .sec-light .btn-ghost:hover{border-color:var(--gold-ink);color:var(--gold-deep)}
  .sec-light .btn-dark{background:#15151a;color:#faf9f5;border-color:#15151a}
  .sec-light .btn-dark:hover{background:#000;border-color:#000}

  /* inputs */
  .sec-light input,.sec-light textarea,.sec-light select{background:#fff!important;border-color:var(--lt-line-strong)!important;color:var(--lt-ink)!important}
  .sec-light input::placeholder,.sec-light textarea::placeholder{color:var(--lt-ink-3)!important}

  /* ambient gold halos: soften on light */
  .sec-light [style*="rgba(216,182,106"]:not(.ph),
  .sec-light [style*="rgba(244,194,56"]:not(.ph){opacity:.5}

  .sec-light .glow{box-shadow:0 0 0 1px rgba(150,116,47,.2),0 30px 70px -40px rgba(18,18,22,.35)}

  /* donation active pill */
  .sec-light .bg-bone-50{background:#15151a!important;color:#faf9f5!important;border-color:#15151a!important}

  /* ── Keep cinematic dark inside photos & dark tiles (must come last) ── */
  .sec-light :is(.ph,.tile-dark){opacity:1}
  .sec-light .tile-dark{background:linear-gradient(135deg,#101014 0%,#15161b 100%)!important;box-shadow:none}
  .sec-light :is(.ph,.tile-dark) [class*="text-bone"]{color:#f3f2ec!important}
  .sec-light :is(.ph,.tile-dark) [class*="text-gold"]{color:#e3c98a!important}
  .sec-light :is(.ph,.tile-dark) .eyebrow{color:#d8b66a}
  .sec-light :is(.ph,.tile-dark) [class*="border-white"]{border-color:rgba(255,255,255,.16)!important}
  .sec-light :is(.ph,.tile-dark) [class*="bg-ink"]{background:rgba(10,10,12,.6)!important;box-shadow:none}
  .sec-light :is(.ph,.tile-dark) [class*="bg-white/"]{background:rgba(255,255,255,.07)!important}
</style>

<script>
/* Reveal safety-net: guarantee scroll-reveal content is never permanently hidden,
   even for very tall blocks or content added on filter/view changes. */
(function(){
  function revealVisible(){
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var els = document.querySelectorAll('.reveal:not(.in), .reveal-stagger:not(.in)');
    for (var i=0;i<els.length;i++){
      var r = els[i].getBoundingClientRect();
      if (r.top < vh * 0.95 && r.bottom > 0) els[i].classList.add('in');
    }
  }
  window.addEventListener('scroll', revealVisible, {passive:true});
  window.addEventListener('resize', revealVisible);
  document.addEventListener('DOMContentLoaded', revealVisible);
  // React mounts + dynamic re-renders (filters, view toggle) settle over time
  var n=0, iv=setInterval(function(){ revealVisible(); if(++n>60) clearInterval(iv); }, 250);
  setTimeout(revealVisible, 300);
  // Hard guarantee: after the app has mounted, force all reveal content visible
  // regardless of scroll position or animation state (opacity-only via <html>.revealed).
  function forceReveal(){ document.documentElement.classList.add('revealed'); }
  setTimeout(forceReveal, 1800);
  window.addEventListener('load', function(){ setTimeout(forceReveal, 600); });
})();
</script>
