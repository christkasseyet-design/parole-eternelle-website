<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<script src="galerie-app.js" defer></script>

<style>
  /* En-tête escamotable : libère l'écran en descendant, revient en remontant. */
  header{transition:transform .34s cubic-bezier(.2,.7,.2,1)}
  html.chrome-hidden header{transform:translateY(-100%)}
  @media (prefers-reduced-motion: reduce){ header{transition:none} }
</style>
<script>
(function(){
  var root=document.documentElement, last=0, ticking=false;
  function upd(){
    ticking=false;
    var y=window.scrollY||window.pageYOffset;
    if(y<140){ root.classList.remove('chrome-hidden'); last=y; return; }
    if(y>last+6){ root.classList.add('chrome-hidden'); }
    else if(y<last-6){ root.classList.remove('chrome-hidden'); }
    last=y;
  }
  window.addEventListener('scroll',function(){ if(!ticking){ticking=true;requestAnimationFrame(upd);} },{passive:true});
  window.addEventListener('resize',upd,{passive:true});
})();
</script>
</body>
